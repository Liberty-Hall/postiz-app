# Builds the deploy branch, Postiz plus Liberty Hall's fixes, and
# publishes it as ghcr.io/liberty-hall/postiz-app, tagged sha-<commit>,
# for post.libertyh.com. amd64 only: that is what it runs on. Don't push
# tags to this fork: upstream's build-containers.yml runs on any tag and
# would try to push to gitroomhq's registry.
name: liberty-hall-image
on:
  push:
    branches: [deploy]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/liberty-hall/postiz-app
          tags: |
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
